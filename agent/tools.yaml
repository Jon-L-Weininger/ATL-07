sources:
  a4i_bigquery:
    kind: bigquery
    project: qwiklabs-gcp-04-e7160ff57547
    location: US

tools:
  list_surplus_postings:
    kind: bigquery-sql
    source: a4i_bigquery
    description: >-
      List all available surplus postings from the a4i_food.surplus_postings_view view,
      ordered by posting_id. Includes donor Name and current fulfilment status.
    statement: |
      SELECT
        p.posting_id,
        p.track,
        p.Name AS donor_name,
        p.posting_text,
        p.foodkeeper_product,
        p.storage_state,
        p.hours_available,
        p.shelf_life_hours,
        p.hours_remaining,
        COALESCE(f.Fulfiment_flg, FALSE) AS is_fulfilled,
        f.Recepient_Id AS fulfilled_recipient_id
      FROM `qwiklabs-gcp-04-e7160ff57547.a4i_food.surplus_postings_view` p
      LEFT JOIN `qwiklabs-gcp-04-e7160ff57547.a4i_food.RECIPIENT_FULFILMENTS` f
        ON p.posting_id = f.Posting_id AND f.Fulfiment_flg = TRUE
      ORDER BY p.posting_id ASC

  get_surplus_posting:
    kind: bigquery-sql
    source: a4i_bigquery
    description: >-
      Fetch a single surplus posting by its integer posting_id (1 through 10)
      from a4i_food.surplus_postings_view, including donor Name and fulfilment status.
    parameters:
      - name: posting_id
        type: integer
        description: The integer posting_id (1 to 10) to retrieve.
    statement: |
      SELECT
        p.posting_id,
        p.track,
        p.Name AS donor_name,
        p.posting_text,
        p.foodkeeper_product,
        p.storage_state,
        p.hours_available,
        p.shelf_life_hours,
        p.hours_remaining,
        COALESCE(f.Fulfiment_flg, FALSE) AS is_fulfilled,
        f.Recepient_Id AS fulfilled_recipient_id
      FROM `qwiklabs-gcp-04-e7160ff57547.a4i_food.surplus_postings_view` p
      LEFT JOIN `qwiklabs-gcp-04-e7160ff57547.a4i_food.RECIPIENT_FULFILMENTS` f
        ON p.posting_id = f.Posting_id AND f.Fulfiment_flg = TRUE
      WHERE p.posting_id = @posting_id

  search_shelf_life:
    kind: bigquery-sql
    source: a4i_bigquery
    description: >-
      Search the USDA FoodKeeper shelf_life table by product name, subtitle,
      keywords, or category (case-insensitive substring match) to verify safe
      refrigerated_hours and pantry_hours for a food item.
    parameters:
      - name: search_term
        type: string
        description: Product keyword to look up (e.g., 'spinach', 'milk', 'bread', 'blueberries', 'formula').
    statement: |
      SELECT
        product_id,
        product_name,
        product_subtitle,
        category,
        keywords,
        refrigerated_hours,
        refrigerated_note,
        pantry_hours,
        pantry_note
      FROM `qwiklabs-gcp-04-e7160ff57547.a4i_food.shelf_life`
      WHERE LOWER(product_name) LIKE CONCAT('%', LOWER(@search_term), '%')
         OR LOWER(IFNULL(product_subtitle, '')) LIKE CONCAT('%', LOWER(@search_term), '%')
         OR LOWER(IFNULL(keywords, '')) LIKE CONCAT('%', LOWER(@search_term), '%')
         OR LOWER(IFNULL(category, '')) LIKE CONCAT('%', LOWER(@search_term), '%')
      ORDER BY product_name ASC
      LIMIT 15

  match_recipients_vector:
    kind: bigquery-sql
    source: a4i_bigquery
    description: >-
      Semantic + operational + neighborhood equity search over a4i_food.recipient_embeddings
      using BigQuery VECTOR_SEARCH and gemini-embedding-2.
      Returns the top 20 semantically similar recipients along with their full
      profile_text, cold_storage type ('walk-in', 'commercial', 'domestic', 'medical', 'vehicle', 'none'),
      frozen_storage, loading_dock, refrigerated_transport, max_pallets, pickup_window_hours,
      service_days, populations_served, and pre-joined nearest Census tract equity metrics
      (tract_poverty_rate, tract_assistance_rate, tract_no_vehicle_rate, tract_median_income, tract_distance_km).
    parameters:
      - name: query_text
        type: string
        description: >-
          Rich natural-language query describing the surplus food offer, storage state,
          volume/pallets, and ideal recipient type (e.g., '10 crates of fresh spinach needing cold storage for produce pantry or soup kitchen').
      - name: max_pickup_window_hours
        type: integer
        description: >-
          Maximum acceptable recipient pickup_window_hours (typically set to the posting's hours_remaining
          so the recipient can receive the food before spoilage). Use 9999 if unconstrained.
    statement: |
      SELECT
        r.recipient_id,
        r.name,
        r.street,
        r.city,
        r.state,
        r.zip_code,
        r.archetype,
        r.archetype_label,
        r.cold_storage,
        r.frozen_storage,
        r.loading_dock,
        r.refrigerated_transport,
        r.max_pallets,
        r.pickup_window_hours,
        r.weekly_households,
        r.populations_served,
        r.service_days,
        r.profile_text,
        r.profile_source,
        d.tract_geo_id,
        ROUND(d.poverty_rate, 4) AS tract_poverty_rate,
        ROUND(d.assistance_rate, 4) AS tract_assistance_rate,
        ROUND(d.no_vehicle_rate, 4) AS tract_no_vehicle_rate,
        ROUND(d.median_income, 0) AS tract_median_income,
        d.distance_to_tract_miles AS tract_distance_miles,
        ROUND(vs.distance, 4) AS cosine_distance,
        ROUND(1.0 - vs.distance, 4) AS cosine_similarity
      FROM VECTOR_SEARCH(
        TABLE `qwiklabs-gcp-04-e7160ff57547.a4i_food.recipient_embeddings`,
        'embedding',
        (
          SELECT
            AI.EMBED(
              @query_text,
              connection_id => 'us.vertex_ai',
              endpoint => 'gemini-embedding-2'
            ).result AS embedding
        ),
        top_k => 20,
        distance_type => 'COSINE',
        options => '{"use_brute_force":true}'
      ) vs
      JOIN `qwiklabs-gcp-04-e7160ff57547.a4i_food.recipients` r
        ON vs.base.recipient_id = r.recipient_id
      LEFT JOIN `qwiklabs-gcp-04-e7160ff57547.a4i_food.recipients_demographics` d
        ON vs.base.recipient_id = d.recipient_id
      WHERE r.pickup_window_hours <= @max_pickup_window_hours
      ORDER BY vs.distance ASC, d.poverty_rate DESC

  match_posting_embeddings_vector:
    kind: bigquery-sql
    source: a4i_bigquery
    description: >-
      Retrieve semantically similar recipients for a specific posting_id (1 through 10)
      using pre-computed vectors from a4i_food.posting_embeddings and a4i_food.recipient_embeddings.
    parameters:
      - name: posting_id
        type: integer
        description: Posting ID (1 to 10) to match.
      - name: max_pickup_window_hours
        type: integer
        description: Maximum acceptable recipient pickup window in hours.
    statement: |
      SELECT
        r.recipient_id,
        r.name,
        r.street,
        r.city,
        r.state,
        r.zip_code,
        r.archetype,
        r.archetype_label,
        r.cold_storage,
        r.frozen_storage,
        r.loading_dock,
        r.refrigerated_transport,
        r.max_pallets,
        r.pickup_window_hours,
        r.weekly_households,
        r.populations_served,
        r.service_days,
        r.profile_text,
        r.profile_source,
        d.tract_geo_id,
        ROUND(d.poverty_rate, 4) AS tract_poverty_rate,
        ROUND(d.assistance_rate, 4) AS tract_assistance_rate,
        ROUND(d.no_vehicle_rate, 4) AS tract_no_vehicle_rate,
        ROUND(d.median_income, 0) AS tract_median_income,
        d.distance_to_tract_miles AS tract_distance_miles,
        ROUND(vs.distance, 4) AS cosine_distance,
        ROUND(1.0 - vs.distance, 4) AS cosine_similarity
      FROM VECTOR_SEARCH(
        TABLE `qwiklabs-gcp-04-e7160ff57547.a4i_food.recipient_embeddings`,
        'embedding',
        (
          SELECT embedding
          FROM `qwiklabs-gcp-04-e7160ff57547.a4i_food.posting_embeddings`
          WHERE posting_id = @posting_id
        ),
        top_k => 20,
        distance_type => 'COSINE',
        options => '{"use_brute_force":true}'
      ) vs
      JOIN `qwiklabs-gcp-04-e7160ff57547.a4i_food.recipients` r
        ON vs.base.recipient_id = r.recipient_id
      LEFT JOIN `qwiklabs-gcp-04-e7160ff57547.a4i_food.recipients_demographics` d
        ON vs.base.recipient_id = d.recipient_id
      WHERE r.pickup_window_hours <= @max_pickup_window_hours
      ORDER BY vs.distance ASC, d.poverty_rate DESC

toolsets:
  food_broker_toolset:
    - list_surplus_postings
    - get_surplus_posting
    - search_shelf_life
    - match_recipients_vector
    - match_posting_embeddings_vector
